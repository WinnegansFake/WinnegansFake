name: CI Suite (Validate, Test & Build)

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  validate-and-test:
    name: Lint, Test, Schema & Workspace Guardrails
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 12.3.4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install jsonschema

      - name: Install Monorepo Dependencies
        run: pnpm install

      - name: Run Schema & Copyright Validation
        run: python validate.py --schema schemas/page-annotation.schema.json --path annotations

      - name: Build Libraries
        run: pnpm --filter @winnegans/epub-reader build

      - name: Run Vitest Suite
        run: pnpm test

      - name: Build Web Application
        run: pnpm --filter web build
